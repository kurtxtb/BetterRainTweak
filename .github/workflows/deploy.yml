name: Deploy Build
run-name: ${{ github.event.inputs.release == 'true' && 'Release' || 'Build' }} for ${{ github.event.inputs.ipa_url }}

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        default: ""
        description: "Direct link to the decrypted IPA"
        required: true
        type: string
      release:
        description: "Release the build"
        required: true
        type: boolean
      is_testflight:
        default: false
        description: "TestFlight build"
        required: true
        type: boolean
  workflow_call:
    inputs:
      ipa_url:
        required: true
        type: string
      is_testflight:
        required: true
        type: boolean
      release:
        required: false
        type: boolean
        default: true
      caller_workflow:
        required: false
        type: string

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build-tweak:
    runs-on: macos-15

    env:
      DEB_DOWNLOADED: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check cache
        run: echo upstream_heads=`git ls-remote https://github.com/theos/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        uses: Randomblock1/theos-action@v1

      - name: Set GNU Make path
        run: |
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Build packages
        run: make package

      - name: Set DEB path
        run: |
          echo "ROOTLESS_DEB_PATH=packages/*-arm64.deb" >> $GITHUB_ENV

      - name: Upload rootless package
        uses: actions/upload-artifact@v4
        with:
          name: rootless package
          path: ${{ env.ROOTLESS_DEB_PATH }}

  build-ipa:
    if: inputs.caller_workflow != 'ci'
    runs-on: macos-15
    needs: build-tweak

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Download Discord IPA
        run: |
          curl -L -o discord.ipa ${{ github.event.inputs.ipa_url || inputs.ipa_url }}

      - name: Clone OpenInDiscord
        uses: actions/checkout@v4
        with:
          repository: castdrian/OpenInDiscord
          path: OpenInDiscord

      - name: Build Safari Extension
        run: |
          cd OpenInDiscord
          xcodebuild build \
            -target "OpenInDiscord Extension" \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="build" \
            PRODUCT_NAME="OpenInDiscord" \
            PRODUCT_BUNDLE_IDENTIFIER="com.hammerandchisel.discord.OpenInDiscord" \
            PRODUCT_MODULE_NAME="OpenInDiscordExt" \
            SKIP_INSTALL=NO \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO | xcbeautify

      - name: Extract Values
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          PACKAGE=$(grep '^Package:' control | cut -d ' ' -f 2)
          VERSION=$(grep '^Version:' control | cut -d ' ' -f 2)
          ROOTLESS_DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm64.deb"
          echo "ROOTLESS_DEB_FILE_NAME=$ROOTLESS_DEB_FILE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Install cyan
        run: pip install --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip Pillow

      - name: Inject tweak and extension
        run: |
          cyan -uwsgq -i discord.ipa -o ${{ env.APP_NAME }}.ipa -f ${{ env.ROOTLESS_DEB_FILE_NAME }} OpenInDiscord/build/OpenInDiscord.appex

      - name: Upload ipa as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ env.APP_NAME }}.ipa

  release-app:
    if: |
      inputs.caller_workflow != 'ci' && 
      (github.event.inputs.release == 'true' || inputs.release == true)
    runs-on: macos-15
    needs: build-ipa
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Values
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          PACKAGE=$(grep '^Package:' control | cut -d ' ' -f 2)
          VERSION=$(grep '^Version:' control | cut -d ' ' -f 2)
          ROOTLESS_DEB_FILE_NAME="${PACKAGE}_${VERSION}_iphoneos-arm64.deb"
          echo "ROOTLESS_DEB_FILE_NAME=$ROOTLESS_DEB_FILE_NAME" >> $GITHUB_ENV
          echo "APP_NAME=$NAME" >> $GITHUB_ENV
          echo "TWEAK_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Extract Discord Version
        run: |
          unzip -q ${{ env.APP_NAME }}.ipa
          VERSION=$(plutil -p Payload/Discord.app/Info.plist | grep CFBundleShortVersionString | cut -d '"' -f 4)
          
          if [[ "${{ github.event.inputs.is_testflight || inputs.is_testflight }}" == "true" ]]; then
            BUILD=$(plutil -p Payload/Discord.app/Info.plist | grep CFBundleVersion | cut -d '"' -f 4)
            VERSION="${VERSION}_${BUILD}"
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi
          
          echo "DISCORD_VERSION=$VERSION" >> $GITHUB_ENV

      # GitHub's generated notes only list merged PRs, so commits pushed straight
      # to main showed up as nothing but the "Full Changelog" link.
      - name: Generate Release Notes
        run: |
          TAG="v${DISCORD_VERSION}"
          HEAD_SHA=$(git rev-parse HEAD)

          # The previous release's tag marks the commit it was built from
          PREV_TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
          PREV_SHA=$(git rev-list -n 1 "$PREV_TAG" 2>/dev/null || true)

          {
            echo "**${APP_NAME} ${TWEAK_VERSION}** · Discord ${DISCORD_VERSION}"
            echo
            echo "### Changes"
            if [ -z "$PREV_SHA" ]; then
              git log -n 30 --no-merges --format="- %s (%h)" HEAD
            elif [ "$PREV_SHA" = "$HEAD_SHA" ]; then
              echo "- No code changes since the previous release"
            else
              git log --no-merges --format="- %s (%h)" "$PREV_SHA..HEAD"
            fi
            if [ -n "$PREV_SHA" ] && [ "$PREV_SHA" != "$HEAD_SHA" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_SHA:0:7}...${HEAD_SHA:0:7}"
            fi
          } > release_notes.md
          cat release_notes.md

          # Rebuilding for the same Discord version reuses the tag, which would otherwise
          # stay on the first build's commit and break the next changelog range
          git tag -f "$TAG" "$HEAD_SHA"
          git push -f origin "refs/tags/$TAG"

      - name: Remove Old DEB Files
        run: |
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/v${DISCORD_VERSION}" --jq .id 2>/dev/null || true)
          if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "No existing release for v${DISCORD_VERSION}"
            exit 0
          fi

          gh api --paginate "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --jq '.[] | "\(.id) \(.name)"' |
            while read -r ASSET_ID ASSET_NAME; do
              if [[ "$ASSET_NAME" == *.deb && "$ASSET_NAME" != "$ROOTLESS_DEB_FILE_NAME" ]]; then
                echo "Deleting $ASSET_NAME"
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ASSET_ID"
              fi
            done

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.DISCORD_VERSION }}
          files: |
            ${{ env.ROOTLESS_DEB_FILE_NAME }}
            ${{ env.APP_NAME }}.ipa
          body_path: release_notes.md
          prerelease: ${{ env.IS_PRERELEASE }}
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
